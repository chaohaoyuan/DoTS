[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dots"
version = "1.0.0"
description = "DoTS: Dynamic Sparse Task Vector Merging"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "optuna",
  "pandas",
  "safetensors",
  "seaborn",
  "torch",
  "tqdm",
  "transformers",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
